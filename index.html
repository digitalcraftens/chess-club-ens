const START="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",F="abcdefgh";

function parse(f){const p=f.split(" "),b=[];for(const c of p[0]){if(c==="/")continue;if(c>="1"&&c<="8")for(let i=0;i<+c;i++)b.push("");else b.push(c)}return{b,t:p[1],c:p[2],e:p[3],h:+p[4],n:+p[5]}}

 return 0}

    if(y&&isW(y)!==w)add(to,r+d===pr?{pr:1}:{});else if(!y&&s.e!=="-"&&sqi(s.e)===to)add(to,{ep:1})}}

   for(let rr=r+a,ff=f+c;on(rr,ff);rr+=a,ff+=c){const to=rr*8+ff,y=b[to];if(!y)add(to);else{if(isW(y)!==w)add(to);break}}}}

function apply(s,m,pq){const b=s.b.slice(),x=b[m.from],w=s.t==="w",u=x.toUpperCase(),cap=b[m.to]||m.ep;

function mkdb(){const ref=(c,id)=>({id,

 loc:()=>{loc={w:"L",b:"L",fen:START,moves:[],last:null,st:"active",res:"",why:""};cur="local";sel=null;paint()},
